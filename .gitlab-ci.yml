stages:
  - test
  - package

variables:
  BETTER_QR_CODES_NO_REGISTER: "1"

test:
  stage: test
  image: python:3.13-slim
  script:
    - python -m unittest discover -s tests

kicad-geometry-tests:
  stage: test
  image: kicad/kicad:10.0
  script:
    - python3 -m unittest discover -s tests

package:
  stage: package
  image: python:3.13-slim
  needs:
    - test
    - kicad-geometry-tests
  script:
    - python scripts/build_release.py
  artifacts:
    name: "better-qrcodes-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
