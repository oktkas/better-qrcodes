name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing tag to publish as a release
        required: false

env:
  BETTER_QR_CODES_NO_REGISTER: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests

  kicad-geometry-tests:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - run: python3 -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    needs: [test, kicad-geometry-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: better-qrcodes-dist
          path: dist/

  publish-release:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_tag
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.publish_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: better-qrcodes-dist
          path: dist/
      - run: |
          archive="$(find dist -maxdepth 1 -name '*-pcm.zip' -print -quit)"
          test -n "$archive"
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "$archive#KiCad PCM package" --title "Better QR Codes $version" --notes-file CHANGELOG.md --verify-tag
